name: Build unsigned IPA

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  tests:
    name: Logic tests (macOS)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The README's logic tests, promoted into CI so a broken activation,
      # audit or resolver change blocks the IPA build instead of shipping.
      - name: Run GestaltPresets logic tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/gestalt-tests
          xcrun swiftc \
            GestaltEdit/GestaltModels.swift \
            GestaltEdit/CacheDataUnlock.swift \
            GestaltEdit/DeviceIdentityAudit.swift \
            GestaltEdit/GestaltTweaks.swift \
            GestaltEdit/GestaltBackupStore.swift \
            GestaltEdit/EligibilityOverride.swift \
            GestaltEdit/EligibilityTemplate.swift \
            Tests/GestaltPresets/main.swift \
            -o /tmp/gestalt-tests/gestalt-preset-tests
          /tmp/gestalt-tests/gestalt-preset-tests

      - name: Run DeviceProfiles tests
        run: |
          set -euo pipefail
          xcrun swiftc \
            GestaltEdit/GestaltModels.swift \
            GestaltEdit/CacheDataUnlock.swift \
            GestaltEdit/DeviceIdentityAudit.swift \
            Tests/DeviceProfiles/main.swift \
            -o /tmp/gestalt-tests/device-profile-tests
          /tmp/gestalt-tests/device-profile-tests

  build:
    name: Build GestaltEdit (unsigned, device)
    needs: tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos|watchos" || true

      - name: Build app (unsigned, iphoneos)
        run: |
          set -o pipefail
          xcodebuild \
            -project GestaltEdit.xcodeproj \
            -scheme GestaltEdit \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$(pwd)/build" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find build -type d -name "GestaltEdit.app" | sort | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: GestaltEdit.app not found under build/"
            find build -maxdepth 4 -type d | head -50
            exit 1
          fi
          echo "Found app bundle: $APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          # Strip the embedded Watch helper: its WKCompanionAppBundleIdentifier
          # is static (me.ssus.gestaltedit), but bundle-ID-rewriting signers
          # (iLoader, isideload, AltStore-style suffixes) install the phone app
          # under a modified identifier, and the device then rejects the whole
          # bundle with InvalidCompanionAppBundleIdentifier (upstream
          # frs0n/GestaltEdit#108). A static plist cannot chase a generated
          # suffix, so the Watch helper is not shipped; the phone app and its
          # iPhone features are unaffected.
          rm -rf "Payload/GestaltEdit.app/Watch"
          # Ad-hoc sign so the bundle is structurally valid for sideload tools
          # (Sideloadly / AltStore / TrollStore re-sign with a real identity)
          codesign --force --deep --sign - "Payload/GestaltEdit.app" \
            || echo "WARN: ad-hoc codesign failed, shipping unsigned"
          zip -qry GestaltEdit-DictationSafe-unsigned.ipa Payload
          echo "IPA contents:"
          unzip -l GestaltEdit-DictationSafe-unsigned.ipa | head -25
          ls -la GestaltEdit-DictationSafe-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestaltEdit-DictationSafe-unsigned-ipa
          path: GestaltEdit-DictationSafe-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log (debug)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
