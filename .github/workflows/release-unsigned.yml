name: Release unsigned IPA

on:
  push:
    tags:
      - "v*"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unsigned-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Siri and asset logic tests
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run GestaltPresets tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/gestalt-tests
          xcrun swiftc \
            GestaltEdit/GestaltModels.swift \
            GestaltEdit/CacheDataUnlock.swift \
            GestaltEdit/DeviceIdentityAudit.swift \
            GestaltEdit/GestaltTweaks.swift \
            GestaltEdit/GestaltBackupStore.swift \
            GestaltEdit/EligibilityOverride.swift \
            GestaltEdit/EligibilityTemplate.swift \
            Tests/GestaltPresets/main.swift \
            -o /tmp/gestalt-tests/gestalt-preset-tests
          /tmp/gestalt-tests/gestalt-preset-tests

      - name: Run DeviceProfiles tests
        run: |
          set -euo pipefail
          xcrun swiftc \
            GestaltEdit/GestaltModels.swift \
            GestaltEdit/CacheDataUnlock.swift \
            GestaltEdit/DeviceIdentityAudit.swift \
            Tests/DeviceProfiles/main.swift \
            -o /tmp/gestalt-tests/device-profile-tests
          /tmp/gestalt-tests/device-profile-tests

      - name: Run ModelAssets tests
        run: |
          set -euo pipefail
          xcrun swiftc \
            GestaltEdit/ModelAssetInventory.swift \
            Tests/ModelAssets/main.swift \
            -o /tmp/gestalt-tests/model-asset-tests
          /tmp/gestalt-tests/model-asset-tests

  release:
    needs: tests
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # A tag build publishes under its tag. A plain push to main publishes
      # under the version in VERSION, so the IPA from an ordinary commit still
      # lands on Releases instead of only as a workflow artifact. Re-running
      # with an unchanged VERSION replaces the asset rather than failing.
      - name: Resolve release tag
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(tr -d '[:space:]' < VERSION)"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing this ${GITHUB_REF_TYPE} build as ${tag}"

      # Same proven build recipe as build.yml (which runs on every push).
      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project GestaltEdit.xcodeproj \
            -scheme GestaltEdit \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$(pwd)/build" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Package unsigned IPA
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          APP=$(find build -type d -name "GestaltEdit.app" | sort | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: GestaltEdit.app not found under build/"
            find build -maxdepth 4 -type d | head -50
            exit 1
          fi
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          # Strip the embedded Watch helper: its static
          # WKCompanionAppBundleIdentifier cannot match the modified bundle ID
          # that bundle-ID-rewriting signers install the phone app under, and
          # the device rejects the whole IPA with
          # InvalidCompanionAppBundleIdentifier (upstream frs0n/GestaltEdit#108).
          rm -rf "Payload/GestaltEdit.app/Watch"
          # Ad-hoc sign so the bundle is structurally valid for sideload tools
          # (iLoader / Sideloadly / AltStore re-sign with a real identity)
          codesign --force --deep --sign - "Payload/GestaltEdit.app" \
            || echo "WARN: ad-hoc codesign failed, shipping unsigned"
          zip -qry "GestaltEdit-${TAG}-unsigned.ipa" Payload
          ls -la "GestaltEdit-${TAG}-unsigned.ipa"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" \
                 --title "GestaltEdit $TAG" \
                 --generate-notes
          gh release upload "$TAG" \
            "GestaltEdit-${TAG}-unsigned.ipa" --clobber
